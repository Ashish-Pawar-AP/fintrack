name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix server install
      - run: npm --prefix server test
      - run: npm --prefix client install
      - run: npm --prefix client run build
